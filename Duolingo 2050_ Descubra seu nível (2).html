<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duolingo 2050: Descubra seu nível</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--bg:#ffffff;--text:#4b4b4b;--sub:#777777;--line:#e5e5e5;--chip:#ffffff;--green:#58cc02;--greend:#58a700;--okbg:#d7ffb8;--ok:#58a700;--badbg:#ffdfe0;--bad:#ea2b2b;--blue:#1cb0f6;--track:#e5e5e5;--card:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--text:#dce6ec;--sub:#8ba0ab;--line:#37464f;--chip:#131f24;--okbg:#1d3a14;--ok:#89e219;--badbg:#3a1c1f;--bad:#ff7878;--track:#37464f;--card:#1a2a31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131f24;--text:#dce6ec;--sub:#8ba0ab;--line:#37464f;--chip:#131f24;--okbg:#1d3a14;--ok:#89e219;--badbg:#3a1c1f;--bad:#ff7878;--track:#37464f;--card:#1a2a31;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito','DIN Rounded',Arial,sans-serif;font-weight:800}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:20px 20px 0}
.top{display:flex;align-items:center;gap:14px}
.x{background:none;border:0;color:#afafaf;font-size:34px;line-height:1;cursor:pointer;padding:0 4px}
.track{flex:1;height:16px;background:var(--track);border-radius:10px;overflow:hidden}
.bar{height:100%;background:var(--green);border-radius:10px;position:relative;transition:width .4s;min-width:16px}
.bar:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.hp{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:26px}
.streak{color:var(--green);font-size:15px;letter-spacing:1.5px;text-transform:uppercase;margin:8px 0 0 52px;min-height:20px}
main{flex:1;padding-top:10px}
h2{font-size:27px;margin:16px 0 8px;color:var(--text)}
.art{text-align:center;font-size:120px;line-height:1.2;margin:18px 0}
.sent{font-size:23px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:30px 0}
.blank{display:inline-block;min-width:130px;min-height:54px;border-bottom:2px solid var(--line)}
.say{display:flex;align-items:center;gap:14px;margin:18px 0 22px}
.bub{flex:1;border:2px solid var(--line);border-radius:18px;padding:16px;font-size:22px;font-weight:600;display:flex;gap:12px;align-items:center}
.spk{background:none;border:0;cursor:pointer;font-size:28px;padding:0}
.answer{min-height:128px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:6px 0;background:repeating-linear-gradient(to bottom,transparent 0 62px,var(--line) 62px 64px);border-top:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:34px 0}
.chip{padding:11px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--chip);color:var(--text);font:600 20px 'Nunito',Arial,sans-serif;cursor:pointer}
.chip.used{background:var(--line);border-color:transparent;color:transparent;pointer-events:none}
.foot{margin:0 -20px;padding:18px 20px 26px}
.foot.ok{background:var(--okbg)}.foot.bad{background:var(--badbg)}
.fb{font-size:24px;margin-bottom:14px}.ok .fb{color:var(--ok)}.bad .fb{color:var(--bad)}
.fb small{display:block;font-size:17px;font-weight:600;margin-top:4px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:var(--green);color:#fff;font:900 17px 'Nunito',Arial,sans-serif;letter-spacing:.9px;text-transform:uppercase;box-shadow:0 4px 0 var(--greend);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{background:var(--track);color:#afafaf;box-shadow:0 4px 0 var(--line);cursor:default}
.bad .btn{background:#ff4b4b;box-shadow:0 4px 0 #ea2b2b}
.center{text-align:center}.center h1{font-size:34px;margin:18px 0 10px}
.center p{font-size:20px;font-weight:600;color:var(--sub);margin:0 auto 24px;max-width:420px;line-height:1.4}
.lvl{display:inline-block;font-size:40px;color:var(--green);margin:8px 0}
.cards{display:grid;gap:14px;margin:14px 0}
.card{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:18px}
.card h3{margin:0;font-size:24px}
.card.max{border-color:#ce82ff}.card.sup{border-color:var(--green)}
.off{float:right;background:#ffc800;color:#4b4b4b;border-radius:12px;padding:4px 12px;font-size:20px}
.card ul{margin:10px 0 12px;padding-left:22px;font-size:17px;font-weight:600;color:var(--sub);line-height:1.5}
.code{border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;font-size:21px;letter-spacing:2px;color:var(--text)}
.qrow{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;color:var(--sub);margin:6px 0 24px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.lang{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px;font-weight:800;font-size:20px}.lang span{font-size:48px}
</style>
</head>

var Q=[];

function reset(){st={i:-1,sel:[],checked:false,ok:false,score:0,streak:0,pick:false,lang:null}}

function start(){st.pick=true;render()}
function pickLang(k){st.lang=LANGS[k];Q=st.lang.q;st.pick=false;st.i=0;st.sel=[];st.checked=false;render()}
function tap(k){var q=Q[st.i];if(st.checked)return;var p=st.sel.indexOf(k);
if(q.t==='fill'){st.sel=p>-1?[]:[k]}else{if(p>-1)st.sel.splice(p,1);else st.sel.push(k)}render()}
function user(){var q=Q[st.i];return q.t==='fill'?q.o[st.sel[0]]:st.sel.map(function(k){return q.o[k]}).join(' ')}
function check(){var q=Q[st.i];st.ok=user()===q.ans;st.checked=true;if(st.ok){st.score++;st.streak++}else st.streak=0;render()}
function next(){st.i++;st.sel=[];st.checked=false;render()}
function chips(q){return q.o.map(function(w,k){return '<button class="chip'+(st.sel.indexOf(k)>-1?' used':'')+'" onclick="tap('+k+')">'+w+'</button>'}).join('')}
function qr(seed){var h=seed,s='';for(var y=0;y<9;y++)for(var x=0;x<9;x++){var f=(x<3&&y<3)||(x>5&&y<3)||(x<3&&y>5);h=(h*1103515245+12345)&2147483647;if(f||((h>>16)&1))s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
return '<svg width="76" height="76" viewBox="0 0 9 9" fill="currentColor" aria-label="QR code ilustrativo" style="color:var(--text)">'+s+'</svg>'}

else if(st.i===-1){h='<main class="center" style="padding-top:8vh">'+owl(170)+'<h1>Descubra seu nível de idioma</h1><p>3 atividades rápidas. No final, um cupom de desconto só para você.</p><button class="btn" onclick="start()">Começar</button></main><div style="height:28px"></div>'}
else if(st.i===3){var lv=st.score===3?'Intermediário · B1':st.score===2?'Básico · A2':'Iniciante · A1';
